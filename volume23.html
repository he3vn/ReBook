<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volume23</title>
    <link rel="stylesheet" href="css/slider.css">
    <style>
      .rb-slider-wrap,
      .rb-list {
        width: 100% !important;
        display: flex !important;
        justify-content: center !important;
        overflow: visible !important;
      }

      .rb-slider-wrap {
        margin-top: 14px !important;
      }

      .rb-list-inner {
        display: flex !important;
        justify-content: center !important;
        align-items: center !important;
        flex-wrap: nowrap !important;
        gap: 9px !important;
        width: auto !important;
        max-width: none !important;
      }

      .rb-list-item {
        flex-shrink: 0 !important;
      }

      .tag-small {
        display: inline-flex !important;
        align-items: center !important;
        height: auto !important;
        padding: 9px 21px !important;
        border-radius: 999px !important;
      }

      .tag-small,
      .tag-small__text {
        font-size: 21px !important;
        font-weight: 600 !important;
        line-height: 1.2 !important;
      }
    </style>
</head>
<body>

<div class="card" style="font-family: Degular, serif; font-weight: 600; font-size: 24px; color: #222; text-align: center;">Tappei Nagatsuki</div>
<div class="card" style="font-family: Champ, Arial, serif; font-weight: 700; font-size: 94px; color: #222; text-align: center;">Volume 23</div>


<div class="rb-slider-wrap">
  <div class="books-slider__genre-list-wrap rb-list">
    <div class="books-slider__genre-list rb-list-inner" role="list">

      <div class="books-slider__genre-list-item rb-list-item" role="listitem">
        <span class="tag-small" style="background-color: #9e81e4; color: white;">
          <span class="tag-small__text">Fantasy</span>
        </span>
      </div>

      <div class="books-slider__genre-list-item rb-list-item" role="listitem">
        <span class="tag-small" style="background-color: #e6ff2b; color: black;">
          <span class="tag-small__text">Light novel</span>
        </span>
      </div>

      <div class="books-slider__genre-list-item rb-list-item" role="listitem">
        <span class="tag-small" style="background-color: #00ecef; color: black;">
          <span class="tag-small__text">Aura farm</span>
        </span>
      </div>

    </div>
  </div>
</div>
